<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marketing Analytics · CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try { if (!localStorage.getItem("lumen-crm-session") && !/access_token|error=/.test(location.hash)) location.replace("login.html"); } catch (e) {}</script>
</head>
<body data-page="marketing">
  <div class="shell">
    <aside id="nav"></aside>
    <main>
      <header class="page-head">
        <div>
          <p class="eyebrow">Marketing Analytics</p>
          <h1>Where your leads <span class="glow"><span class="glow-text">come from</span></span></h1>
        </div>
        <button class="btn btn-primary" id="add">+ New campaign</button>
      </header>

      <section class="grid kpis" id="kpis"></section>
      <section class="grid two-col">
        <div class="card">
          <div class="card-head"><h2>New leads per week</h2><span class="meta">Last 8 weeks</span></div>
          <div id="weekly"></div>
        </div>
        <div class="card">
          <div class="card-head"><h2>Lead sources</h2></div>
          <div class="table-wrap"><table class="plain">
            <thead><tr><th>Source</th><th>Leads</th><th>Clients</th><th>Conv.</th><th>Revenue</th></tr></thead>
            <tbody id="sources"></tbody>
          </table></div>
        </div>
      </section>
      <section class="card section-gap">
        <div class="card-head"><h2>Campaigns</h2><span class="meta">Click a row to edit</span></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Campaign</th><th>Channel</th><th>Spend</th><th>Impressions</th><th>Clicks</th><th>CTR</th><th>Leads</th><th>Cost / lead</th></tr></thead>
          <tbody id="campaigns"></tbody>
        </table></div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
