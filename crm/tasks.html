<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks & Follow-ups · CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>try { if (!localStorage.getItem("lumen-crm-session") && !/access_token|error=/.test(location.hash)) location.replace("login.html"); } catch (e) {}</script>
</head>
<body data-page="tasks">
  <div class="shell">
    <aside id="nav"></aside>
    <main>
      <header class="page-head">
        <div>
          <p class="eyebrow">Tasks &amp; Follow-ups · <span id="task-count"></span></p>
          <h1>Small steps, <span class="glow"><span class="glow-text">done well</span></span></h1>
        </div>
        <button class="btn btn-primary" id="add">+ New task</button>
      </header>

      <div class="toolbar chips">
        <button class="chip" data-f="open">Open</button>
        <button class="chip" data-f="today">Due now</button>
        <button class="chip" data-f="high">High priority</button>
        <button class="chip" data-f="done">Completed</button>
        <button class="chip" data-f="all">All</button>
      </div>
      <section class="grid two-col">
        <div class="card" style="padding:0" id="task-list"></div>
        <div class="card">
          <div class="card-head"><h2>Needs a follow-up</h2></div>
          <p class="hint">Leads in your first three lead stages with no open task and no call booked.</p>
          <div class="list" id="stale"></div>
        </div>
      </section>
    </main>
  </div>
  <div id="modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
